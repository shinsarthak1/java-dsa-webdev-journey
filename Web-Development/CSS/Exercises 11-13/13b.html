<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex{
            display: flex;
            flex-direction: row;
            height: 50px;
        }
        .col1{
            background-color: lightpink;
            width: 100px;
        }
        .col2{
            background-color: lightblue;
            width: 200px;
        }
        .row2{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .row2-item{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="col1"></div>
        <div class="col2">
            <div>row1</div>
            <div class="row2">
            <div class="row2-item">row2</div>
            <div class="row2-item">row2</div>
        </div>
        </div>
    </div>
</body>
</html>
