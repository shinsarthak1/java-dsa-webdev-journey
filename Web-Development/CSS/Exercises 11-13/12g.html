<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
        }
        .row{
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-picture{
            height: 50px;
            width: 50px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 16px;
        }
        .info{
            width: 200px;
        }
        .name{
            font-weight: bold;
            margin-bottom: 3px;
        }
        .handle{
            color: rgb(150,150,150);
            margin-bottom: 5px;
        }
        .category{
            color: rgb(150,150,150);
            font-size: 14px;
        }
        .follow-button{
            background-color: rgb(29, 155, 240);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .follow-button:hover{
            background-color: white;
            color: rgb(29, 155, 240);
        }
    </style>
</head>
<body>
    <div class="row">
        <img class="profile-picture" src="cat.jpg" alt="Cat">
        <div class="info">
            <p class="name">Oliver</p>
            <p class="handle">the cat</p>
            <p class="category">Popular</p>
        </div>
        <button class="follow-button">Follow</button>
    </div>
    <div class="row">
        <img class="profile-picture" src="cat2.jpg" alt="Cat">
        <div class="info">
            <p class="name">Mimi</p>
            <p class="handle">Sleepy cat</p>
            <p class="category">Popular</p>
        </div>
        <button class="follow-button">Follow</button>
    </div>
    <div class="row">
        <img class="profile-picture" src="dog.jpg" alt="Cat">
        <div class="info">
            <p class="name">Rex</p>
            <p class="handle">Happy Bulldog</p>
            <p class="category">Popular</p>
        </div>
        <button class="follow-button">Follow</button>
    </div>
</body>
</html>
