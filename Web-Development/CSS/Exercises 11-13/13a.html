<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex{
            display: flex;
            flex-direction: row;
            height: 50px;
        }
        .col1{
            width: 100px;
            background-color: lightpink;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        .item1{
            background-color: black;
            color: white;
        }
        .col2{
            width: 200px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="col1">
            <div class="item1">
                item1
            </div>
        </div>
        <div class="col2"></div>
    </div>
</body>
</html>
