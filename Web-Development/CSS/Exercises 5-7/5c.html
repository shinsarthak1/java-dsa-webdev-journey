<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Verdana;
            margin-top: 0;
            margin-bottom: 0;
        }
        .title{
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .subtitle{
            color: rgb(100, 100, 100);
            margin-bottom: 18px;
        }
        .content{
            width: 300px;
            line-height: 22px;
            margin-bottom: 18px;
        }
        button{
            font-family: Verdana;
            background-color: green;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <p class="title">HTML CSS Course</p>
    <p class="subtitle">Beginner to Pro</p>
    <p class="content">In this course, we'll learn the skills you need to become a developer.</p>
    <button class="button">Get Started</button>
</body>
</html>
