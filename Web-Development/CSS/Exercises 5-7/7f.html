<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Arial;
            color: rgb(100, 100, 100);
            margin-top: 0;
            margin-bottom: 0;
        }
        .label{
            font-size: 16px;
            margin-bottom: 10px;
        }
        .text-box{
            font-size: 16px;
            width: 400px;
            border: 2px solid rgb(100, 100, 100);
            padding-top: 7px;
            padding-bottom: 7px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .disclaimer{
            font-size: 16px;
            margin-bottom: 20px;
        }
        button{
            background-color: rgb(10, 102, 194);
            color: white;
            font-size: 22px;
            width: 400px;
            border: none;
            padding-top: 16px;
            padding-bottom: 16px;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <p class="label">Email</p>
    <input type="text" class="text-box">
    <p class="disclaimer">By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button>Agree & Join</button>
</body>
</html>
