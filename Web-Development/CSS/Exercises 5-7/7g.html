<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .profile-pic{
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 25px;
            vertical-align: middle;
            margin-right: 6px;
        }

        .text-box{
            font-size: 18px;
            border: none;
            width: 300px;
            vertical-align: middle;
        }

        .tweet-button{
            background-color: rgb(29, 155, 240);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            vertical-align: middle;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <img class="profile-pic" alt="cat.jpg" src="./cat.jpg">
    <input type="text" class="text-box" placeholder="What's happening?">
    <button class="tweet-button">Tweet</button>
</body>
</html>
