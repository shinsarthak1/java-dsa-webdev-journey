<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliver cat</title>
    <style>
        body{
            height: 3000px;
        }
        .header{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 50px;
        }
        .left-section{
            display: flex;
            align-items: center;
        }
        .profile-picture{
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 10px;
        }
        name{
            font-family: Arial;
            font-weight: bold;
        }
        .add-friend{
            background-color: rgb(24, 119, 242);
            color: white;
            font-weight: bold;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            margin-right: 4px;
        }
        .message{
            background-color: rgb(230,230,230);
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius:6px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="left-section">
            <img class="profile-picture" src="./cat.jpg" alt="A cat">
            <div class="name">Oliver Cat</div>
        </div>
        <div class="right-section">
            <button class="add-friend">Add Friend</button>
            <button class="message">Message</button>
        </div>
    </div>
</body>
</html>
