<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .subscribe{
            background-color: red;
            color: white;
            border: none;
            margin-right: 10px;
            transition: opacity 0.15s;
            margin-right: 8px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            vertical-align: top;
        }
        .subscribe:hover{
            background-color: green;
            opacity: 1;
        }
        .subscribe:active{
            background-color: blue;
        }
        .join{
            background-color: white;
            color: rgb(41,118,211);
            border: 1px solid blue;
            cursor: pointer;
            border-radius: 2px;
            transition: background-color 1s,color 1s;
            margin-left: 8px;
            padding-left: 30px;
            padding-top: 20px;
            border-width: 1px;
            vertical-align: top;
            padding: 9px 16px;
        }
        .join:hover{
            background-color: rgb(41,118,211);
            color: white;
        }
        .join:active{
            opacity: 0.7;
        }
        .tweet{
            background-color: rgb(2,158,255);
            color: white;
            border: none;
            padding: 10px 16px;
            margin-left: 8px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            transition: box-shadow 0.15s;
            vertical-align: top;
             /* horizontal position - vertical position - blur radius - color */
        }
        .tweet:hover{
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <button class="subscribe">SUBSCRIBE</button>
    <button class="join">JOIN</button>
    <button class="tweet">Tweet</button>
</body>
</html>
