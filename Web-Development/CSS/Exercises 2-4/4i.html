<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .stretch{
            background-color: green;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 18px;
            cursor: pointer;
            transition: padding 1s;

        .stretch:hover{
            font-size: 18px;
            padding: 18px 36px;
        }
    </style>
</head>
<body>
    <button class="stretch">Stretch</button>
</body>
</html>
