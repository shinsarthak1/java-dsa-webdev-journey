<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            color: rgb(0,113,133);
        }
        a:hover{
            color: rgb(199, 81, 31);
        }
        .price{
            color: rgb(0,118,0);
            font-weight: bold;
        }
        .add-to-cart{
            background-color: rgb(255, 216,20);
            color: black;
            border: none;
            height: 32px;
            width: 110px;
            border-radius: 16px;
            cursor: pointer;
            margin-right: 8px;
        }
        .add-to-cart:hover{
            background-color: rgb(247,202,0);
        }
        .add-to-cart:active{
            opacity: 0.5;
        }
        .buy-now{
            background-color: rgb(255,164,28);
            border: none;
            height: 32px;
            width: 110px;
            border-radius: 16px;
            cursor: pointer;
        }
        .buy-now:hover{
            background-color:rgb(250, 137, 0);
        }
        .buy-now:active{
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <a href="amazon.com">Back to Amazon</a>
    <h1>Nike Black Running Shoes</h1>
    <p class="price">$39 - in stock</p> 
    <p>Free delivery tomorrow</p>
    <button class="add-to-cart">Add to Cart</button>
    <button class="buy-now">Buy now</button>
</body>
</html>
