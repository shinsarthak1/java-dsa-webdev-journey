<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .purple{
            background-color: rgb(121,82,179);
            color: white;
            border: none;
            font-weight: bold;
            height: 40px;
            width: 110px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 6px;
        }

        .white{
            background-color: white;
            color: rgb(108,117,125);
            border-width: 1px;
            border-style: solid;
            border-color: rgb(108, 117, 125);
            height: 40px;
            width: 105px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;

        }
    </style>
</head>
<body>
    <button class="purple">Get Started</button>
    <button class="white">Download</button>
</body>
</html>
