<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .apply{
            background-color: rgb(10,102,194);
            color: white;
            border: none;
            font-weight: bolder;
            cursor: pointer;
            height: 40px;
            width: 240px;
            border-radius: 18px;
            margin-right: 8px;
            font-size: 15px;
        }
        .apply:hover{
            background-color: rgb(2,70,138);
        }
        .save{
            background-color: white;
            color: rgb(10,102,194);
            border: 1px solid rgb(10,102,194);
            height: 45px;
            width: 80px;
            border-radius: 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .save:hover{
            background-color: rgb(226,240,254);
            border-width: 2px;
        }
    </style>
</head>
<body>
    <button class="apply">Apply on company website</button>
    <button class="save">Save</button>
</body>
</html>
