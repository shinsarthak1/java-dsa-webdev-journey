<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .stretch{
            background-color: green;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-left: 10px;
            margin-right: 10px;
            transition: padding 0.15s,margin 0.15s;
        }
        .stretch:hover{
            padding-left: 25px;
            padding-right: 25px;
            margin-left: 0px;
            margin-right: 0px;
        }
    </style>
</head>
<body>
    <h2>Margin and padding together</h2>
    <button class="stretch">One</button>
    <button class="stretch">Two</button>
    <button class="stretch">Three</button>
</body>
</html>
