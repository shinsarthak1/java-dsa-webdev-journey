<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .shadow{
            background-color: green;
            color: white;
            border: none;
            font-size: 18px;
            padding: 8px 16px;
            cursor: pointer;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        .shadow:hover{
            margin: 3px;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <button class="shadow">Shadow</button>
</body>
</html>
