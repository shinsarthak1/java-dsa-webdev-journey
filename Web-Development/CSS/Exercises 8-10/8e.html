<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Arial;
        }
        .title{
            font-size: 40px;
            margin-bottom: 25px;
        }
        input{
            display: block;
            background-color: rgb(240, 240, 240);
            border: none;
            margin-bottom: 10px;
            padding: 15px 20px;
            width: 400px;
            font-size: 16px;
        }

        .destination-textbox{
            margin-bottom: 36px;
        }

        .request{
            background-color: black;
            color: white;
            border: none;
            padding: 15px 26px;
            font-size: 16px;
            margin-right: 20px;
        }
        .schedule{
            background-color: rgb(240, 240, 240);
            border: none;
            padding: 15px 26px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <p class="title">Request a ride now</p>
    <input type="text" class="pickup-textbox" placeholder="Enter pickup location">
    <input type="text" class="destination-textbox" placeholder="Enter destination">
    <button class="request">Request now</button>
    <button class="schedule">Schedule for later</button>
</body>
</html>
