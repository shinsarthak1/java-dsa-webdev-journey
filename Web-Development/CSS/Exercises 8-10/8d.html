<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            border: 1px solid #c8c8c8;
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .first-name, .last-name{
            width: 114px;
        }
        .email{
            display: block;
            width: 265px;
        }
        button{
            background-color: rgb(47, 127, 231);
            color: white;
            border: none;
            padding-top: 14px;
            padding-bottom: 14px;
            width: 300px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <input type="text" class="first-name" placeholder="First name">
    <input type="text" class="last-name" placeholder="Last name">
    <input type="text" class="email" placeholder="Email">
    <button>Sign up</button>
</body>
</html>
